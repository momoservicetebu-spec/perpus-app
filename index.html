  const GAS_URL = "https://script.google.com/macros/s/AKfycbwnRb6cqYz0yJ1oDzIHqwLZiSU77KCc1BJ8az07iA9xbjbti5m13q9EaY-veLwkah5f/exec";

  // Kita membuat "SDK Tiruan" agar kode asli tidak perlu diubah sama sekali
  window.dataSdk = {
    _handler: null,
    
    async init(handler) {
      this._handler = handler;
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        this._handler.onDataChanged(data);
        return { isOk: true };
      } catch (error) {
        console.error("Gagal load data", error);
        return { isOk: false, error };
      }
    },

    async create(record) {
      // Buat ID unik untuk data baru
      record.__backendId = 'ID_' + Date.now().toString() + Math.random().toString(36).substr(2, 5);
      return this._sendToGas('create', record);
    },

    async update(record) {
      return this._sendToGas('update', record);
    },

    async delete(record) {
      return this._sendToGas('delete', record);
    },

    async _sendToGas(action, payload) {
      try {
        // Update tampilan lokal agar terasa cepat (Optimistic UI)
        if (action === 'create') appState.allRecords.push(payload);
        if (action === 'update') {
          const idx = appState.allRecords.findIndex(r => r.__backendId === payload.__backendId);
          if (idx !== -1) appState.allRecords[idx] = payload;
        }
        if (action === 'delete') {
          appState.allRecords = appState.allRecords.filter(r => r.__backendId !== payload.__backendId);
        }
        this._handler.onDataChanged(appState.allRecords);

        // Kirim ke Google Sheets di background (Gunakan text/plain agar tidak diblokir CORS)
        await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, payload: payload })
        });
        return { isOk: true };
      } catch (error) {
        console.error("Error backend:", error);
        return { isOk: false, error };
      }
    }
  };
// Mock Element SDK (karena kita hapus SDK Canva)

    config: null,
    async init() {
      return { isOk: true };
    }
  };

    // Utility Functions
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function calculateLateDays(dueDate) {
      if (!dueDate) return 0;
      const due = new Date(dueDate);
      const today = new Date();
      const diffTime = today - due;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays > 0 ? diffDays : 0;
    }

    function generateBarcode() {
      return 'BRK' + Date.now() + Math.random().toString(36).substr(2, 5).toUpperCase();
    }

    // Data Access Functions
    function getRecordsByType(type) {
      return appState.allRecords.filter(r => r.type === type);
    }

    function getBookByBarcode(barcode) {
      return appState.allRecords.find(r => r.type === 'book' && r.bookBarcode === barcode);
    }

    function getMemberByName(name) {
      return appState.allRecords.find(r => r.type === 'member' && r.memberName === name);
    }

    // CSV Export Functions
    function arrayToCSV(data, headers) {
      const escapeCSV = (str) => {
        if (str == null) return '';
        str = String(str);
        if (str.includes(',') || str.includes('"') || str.includes('\n')) {
          return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
      };

      const csvHeaders = headers.join(',');
      const csvRows = data.map(row => 
        headers.map(header => escapeCSV(row[header])).join(',')
      );

      return [csvHeaders, ...csvRows].join('\n');
    }

    function downloadCSV(filename, fileContent) {
      try {
        const text = String(fileContent ?? '');
        const lowerName = String(filename).toLowerCase();
        let mimeType = 'text/plain;charset=utf-8';

        if (lowerName.endsWith('.csv')) {
          mimeType = 'text/csv;charset=utf-8';
        } else if (lowerName.endsWith('.json')) {
          mimeType = 'application/json;charset=utf-8';
        } else if (lowerName.endsWith('.xls')) {
          mimeType = 'application/vnd.ms-excel;charset=utf-8';
        }

        const blob = new Blob([text], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return true;
      } catch (error) {
        showToast('File tidak dapat diunduh. Silakan coba lagi.', 'error');
        return false;
      }
    }

    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }

          submitBtn.disabled = false;
        }
      });

      document.body.appendChild(modal);
      setTimeout(() => searchInput.focus(), 100);
    }

    async function checkOutVisitor(visitorId) {
      const visitor = appState.allRecords.find(r => r.__backendId === visitorId);
      if (!visitor) return;

      const checkInTime = new Date(visitor.visitorCheckIn);
      const checkOutTime = new Date();
      const durationMinutes = Math.floor((checkOutTime - checkInTime) / (1000 * 60));

      const confirmDiv = document.createElement('div');
      confirmDiv.className = 'fixed inset-0 bg-black bg-opacity-50 modal-backdrop flex items-center justify-center z-50 p-4';
      confirmDiv.innerHTML = `
        <div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full">
          <h2 class="text-2xl font-bold mb-4" style="color: ${window.elementSdk?.config?.text_color || defaultConfig.text_color};">✓ Konfirmasi Check-Out</h2>
          <div class="space-y-3 mb-6">
            <p><strong>Nama:</strong> ${visitor.visitorName}</p>

            <p><strong>Keperluan:</strong> ${visitor.visitorPurpose}</p>

              <p class="font-bold" style="color: ${window.elementSdk?.config?.success_color || defaultConfig.success_color};">Durasi Kunjungan</p>
              <p class="text-2xl font-bold mt-1">${Math.floor(durationMinutes / 60)}j ${durationMinutes % 60}m</p>
            </div>
          </div>
          <div class="flex gap-3">
            <button id="confirmCheckOut" class="flex-1 px-6 py-3 rounded-lg text-white font-semibold" style="background: ${window.elementSdk?.config?.success_color || defaultConfig.success_color};">

        this.innerHTML = '<div class="loading-spinner mx-auto"></div>';

          this.textContent = '✓ Check-Out';
          this.disabled = false;
        }
      });

      document.body.appendChild(confirmDiv);
    }

    function exportVisitorsToCSV() {
      const visitors = getRecordsByType('visitor');
      
      if (visitors.length === 0) {
        showToast('Tidak ada data kunjungan untuk diekspor', 'info');
        return;
      }

      const data = visitors.map(v => ({
        'Nama': v.visitorName,
        'Kelas': v.visitorClass,
        'Keperluan': v.visitorPurpose,
        'Check-In': new Date(v.visitorCheckIn).toLocaleString('id-ID'),
        'Check-Out': v.visitorCheckOut ? new Date(v.visitorCheckOut).toLocaleString('id-ID') : 'Belum Check-Out',
        'Durasi (Menit)': v.visitorDuration || 0,
        'Status': v.visitorCheckOut ? 'Selesai' : 'Aktif',
        'Catatan': v.visitorNotes
      }));

      const headers = ['Nama', 'Kelas', 'Keperluan', 'Check-In', 'Check-Out', 'Durasi (Menit)', 'Status', 'Catatan'];
      const csvContent = arrayToCSV(data, headers);
      downloadCSV('buku_tamu_perpustakaan.csv', csvContent);
      showToast(`${visitors.length} data kunjungan berhasil diekspor!`, 'success');
    }

    function renderCategoriesSection() {
      const allBooks = getRecordsByType('book');
      const categories = {};
      
      allBooks.forEach(book => {
        const cat = book.bookCategory || 'Tidak Berkategori';
        if (!categories[cat]) {
          categories[cat] = {
            name: cat,
            count: 0,
            totalStock: 0,
            books: []
          };

        categories[cat].count++;
        categories[cat].totalStock += book.bookStock;

    async function renameCategory(oldName, btnElement) {
      const newName = document.getElementById('newCategoryNameRename').value.trim();
      
      if (!newName) {
        showToast('Masukkan nama kategori baru', 'error');
        return;
      }

      if (newName === oldName) {
        showToast('Nama kategori sama dengan sebelumnya', 'info');
        return;
      }

      btnElement.innerHTML = '<div class="loading-spinner mx-auto"></div>';
      btnElement.disabled = true;

      const allBooks = getRecordsByType('book');
      const booksToUpdate = allBooks.filter(b => (b.bookCategory || 'Tidak Berkategori') === oldName);

      let successCount = 0;
      let errorCount = 0;

      for (const book of booksToUpdate) {
        const updatedBook = { ...book, bookCategory: newName };
        const result = await window.dataSdk.update(updatedBook);
        
        if (result.isOk) {
          successCount++;
        } else {
          errorCount++;
        }
      }

      if (errorCount === 0) {
        showToast(`Berhasil rename kategori! ${successCount} buku dipindahkan ke "${newName}"`, 'success');
        btnElement.closest('.fixed').remove();
      } else {
        showToast(`Rename selesai dengan ${errorCount} error. ${successCount} buku berhasil dipindahkan.`, 'error');
        btnElement.textContent = 'Rename Kategori';
        btnElement.disabled = false;
      }
    }

    function deleteCategoryModal(categoryName, bookCount) {
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black bg-opacity-50 modal-backdrop flex items-center justify-center z-50 p-4';
      modal.innerHTML = `
        <div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full">

              <p class="text-sm text-gray-700">
                Kategori <strong>"${categoryName}"</strong> memiliki <strong>${bookCount} buku</strong>.
              </p>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Pilih Tindakan:</label>
              <select id="deleteCategoryAction" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg">
                <option value="uncategorized">Pindahkan buku ke "Tidak Berkategori"</option>
                <option value="delete_all">Hapus kategori DAN semua bukunya</option>
              </select>
            </div>
            <div id="deleteWarning" class="p-4 bg-red-100 border border-red-300 rounded-lg hidden">
              <p class="text-sm font-bold" style="color: ${window.elementSdk?.config?.danger_color || defaultConfig.danger_color};">
                🚨 PERHATIAN: Anda akan menghapus ${bookCount} buku secara permanen! Tindakan ini tidak dapat dibatalkan.
              </p>
            </div>
            <div class="flex gap-3 pt-4">
              <button 
                onclick="deleteCategory('${categoryName}', this)"
                class="flex-1 px-6 py-3 rounded-lg text-white font-semibold"
                style="background: ${window.elementSdk?.config?.danger_color || defaultConfig.danger_color};"
              >
                Hapus Kategori
              </button>
              <button 
                onclick="this.closest('.fixed').remove()"
                class="px-6 py-3 rounded-lg border-2 border-gray-300 font-semibold hover:bg-gray-50"
              >
                Batal
              </button>
            </div>
          </div>
        </div>
      `;

      modal.querySelector('#deleteCategoryAction').addEventListener('change', (e) => {
        const warning = modal.querySelector('#deleteWarning');
        if (e.target.value === 'delete_all') {
          warning.classList.remove('hidden');
        } else {
          warning.classList.add('hidden');
        }
      });

      document.body.appendChild(modal);
    }

    async function deleteCategory(categoryName, btnElement) {
      const action = document.getElementById('deleteCategoryAction').value;
      
      btnElement.innerHTML = '<div class="loading-spinner mx-auto"></div>';
      btnElement.disabled = true;

      const allBooks = getRecordsByType('book');
      const booksInCategory = allBooks.filter(b => (b.bookCategory || 'Tidak Berkategori') === categoryName);

      let successCount = 0;
      let errorCount = 0;

      if (action === 'uncategorized') {
        for (const book of booksInCategory) {
          const updatedBook = { ...book, bookCategory: 'Tidak Berkategori' };
          const result = await window.dataSdk.update(updatedBook);
          
          if (result.isOk) {
            successCount++;
          } else {
            errorCount++;
          }
        }

        if (errorCount === 0) {
          showToast(`Kategori "${categoryName}" dihapus! ${successCount} buku dipindahkan ke "Tidak Berkategori"`, 'success');
          btnElement.closest('.fixed').remove();
        } else {
          showToast(`Proses selesai dengan ${errorCount} error. ${successCount} buku berhasil dipindahkan.`, 'error');
          btnElement.textContent = 'Hapus Kategori';
          btnElement.disabled = false;
        }
      } else if (action === 'delete_all') {
        for (const book of booksInCategory) {
          const result = await window.dataSdk.delete(book);
          
          if (result.isOk) {
            successCount++;
          } else {
            errorCount++;
          }
        }

        if (errorCount === 0) {
          showToast(`Kategori "${categoryName}" dan ${successCount} buku berhasil dihapus!`, 'success');
          btnElement.closest('.fixed').remove();
        } else {
          showToast(`Proses selesai dengan ${errorCount} error. ${successCount} buku berhasil dihapus.`, 'error');
          btnElement.textContent = 'Hapus Kategori';
          btnElement.disabled = false;
        }
      }
    }

    async function changeBookCategory(bookId, btnElement) {
      const newCategory = document.getElementById('newBookCategory').value.trim();
      
      if (!newCategory) {
        showToast('Masukkan kategori baru', 'error');
        return;
      }

      btnElement.innerHTML = '<div class="loading-spinner mx-auto"></div>';
      btnElement.disabled = true;

      const book = appState.allRecords.find(r => r.__backendId === bookId);
      if (!book) {
        showToast('Buku tidak ditemukan', 'error');
        return;
      }

      const updatedBook = { ...book, bookCategory: newCategory };
      const result = await window.dataSdk.update(updatedBook);
      
      if (result.isOk) {
        showToast(`Kategori buku berhasil diubah ke "${newCategory}"!`, 'success');
        btnElement.closest('.fixed').remove();
      } else {
        showToast('Gagal mengubah kategori: ' + result.error.message, 'error');
        btnElement.textContent = 'Ubah Kategori';
        btnElement.disabled = false;
      }
    }

      const allMembers = getRecordsByType('member');
      const allLoans = getRecordsByType('loan');
      const activeLoans = allLoans.filter(l => l.loanStatus === 'dipinjam');
      const completedLoans = allLoans.filter(l => l.loanStatus === 'dikembalikan');
      const overdueLoans = activeLoans.filter(l => calculateLateDays(l.loanDueDate) > 0);

      // Category Statistics
      const categoryStats = {};
      allBooks.forEach(book => {
        const cat = book.bookCategory || 'Tidak Berkategori';
        if (!categoryStats[cat]) {
          categoryStats[cat] = { count: 0, stock: 0 };
        }
        categoryStats[cat].count++;
        categoryStats[cat].stock += book.bookStock;
      });
      const topCategories = Object.entries(categoryStats)
        .sort((a, b) => b[1].count - a[1].count)
        .slice(0, 5);

      // Monthly Loan Trend (last 6 months)
      const monthlyTrend = {};
      const last6Months = [];
      for (let i = 5; i >= 0; i--) {
        const date = new Date();
        date.setMonth(date.getMonth() - i);
        const monthKey = date.toLocaleDateString('id-ID', { year: 'numeric', month: 'short' });
        last6Months.push(monthKey);
        monthlyTrend[monthKey] = 0;
      }
      
      allLoans.forEach(loan => {
        const loanDate = new Date(loan.loanDate);
        const monthKey = loanDate.toLocaleDateString('id-ID', { year: 'numeric', month: 'short' });

          monthlyTrend[monthKey]++;

    function exportStatistics() {
      const allBooks = getRecordsByType('book');
      const allMembers = getRecordsByType('member');
      const allLoans = getRecordsByType('loan');
      const activeLoans = allLoans.filter(l => l.loanStatus === 'dipinjam');
      const completedLoans = allLoans.filter(l => l.loanStatus === 'dikembalikan');
      const overdueLoans = activeLoans.filter(l => calculateLateDays(l.loanDueDate) > 0);

      // Category Stats
      const categoryStats = {};
      allBooks.forEach(book => {
        const cat = book.bookCategory || 'Tidak Berkategori';
        if (!categoryStats[cat]) {
          categoryStats[cat] = { count: 0, stock: 0 };
        }
        categoryStats[cat].count++;
        categoryStats[cat].stock += book.bookStock;
      });

      // Fine Stats
      const totalFines = completedLoans
        .filter(l => l.lateDays > 0)
        .reduce((sum, l) => sum + (l.lateDays * 1000), 0);
      const paidFines = completedLoans
        .filter(l => l.lateDays > 0 && l.finePaid)
        .reduce((sum, l) => sum + (l.lateDays * 1000), 0);

      const statistics = [
        { Metrik: 'Total Koleksi Buku', Nilai: allBooks.length + ' judul' },
        { Metrik: 'Total Stok Buku', Nilai: allBooks.reduce((sum, b) => sum + b.bookStock, 0) + ' buku' },
        { Metrik: 'Total Anggota', Nilai: allMembers.length + ' orang' },
        { Metrik: 'Total Peminjaman', Nilai: allLoans.length + ' transaksi' },
        { Metrik: 'Peminjaman Aktif', Nilai: activeLoans.length + ' transaksi' },
        { Metrik: 'Peminjaman Selesai', Nilai: completedLoans.length + ' transaksi' },
        { Metrik: 'Peminjaman Terlambat', Nilai: overdueLoans.length + ' transaksi' },
        { Metrik: 'Return Rate', Nilai: (completedLoans.length > 0 ? ((completedLoans.filter(l => l.lateDays === 0).length / completedLoans.length) * 100).toFixed(1) : 0) + '%' },
        { Metrik: 'Total Kategori', Nilai: Object.keys(categoryStats).length + ' kategori' },
        { Metrik: 'Total Denda', Nilai: 'Rp ' + totalFines.toLocaleString('id-ID') },
        { Metrik: 'Denda Lunas', Nilai: 'Rp ' + paidFines.toLocaleString('id-ID') },
        { Metrik: 'Denda Belum Bayar', Nilai: 'Rp ' + (totalFines - paidFines).toLocaleString('id-ID') }
      ];

      const csvContent = arrayToCSV(statistics, ['Metrik', 'Nilai']);
      downloadCSV('statistik_perpustakaan.csv', csvContent);
      showToast('Statistik berhasil diekspor!', 'success');
    }

        modal.querySelector('#editBookInfoAuthor').textContent = initialBook.bookAuthor;

        const barcode = e.target.value.trim();
        bookInfoDisplay.classList.add('hidden');
        bookNotFound.classList.add('hidden');

        const book = books.find(b => b.bookBarcode === barcode);

          modal.querySelector('#editBookInfoTitle').textContent = book.bookTitle;
          modal.querySelector('#editBookInfoAuthor').textContent = book.bookAuthor;
          modal.querySelector('#editBookInfoCategory').textContent = book.bookCategory;
          modal.querySelector('#editBookInfoStock').textContent = book.bookStock;
          bookInfoDisplay.classList.remove('hidden');
        } else if (barcode.length >= 3) {
          modal.querySelector('#editNotFoundBarcode').textContent = barcode;
          bookNotFound.classList.remove('hidden');

          return;

          m.memberName.toLowerCase().includes(searchTerm) || 
          m.memberClass.toLowerCase().includes(searchTerm)
        );

            </div>
          `).join('');
          resultsDiv.classList.remove('hidden');

          resultsDiv.querySelectorAll('[data-member-name]').forEach(item => {

              const memberName = item.dataset.memberName;

              hiddenInput.value = memberName;
              resultsDiv.classList.add('hidden');

          });

          resultsDiv.innerHTML = '<div class="px-4 py-3 text-center text-gray-500">Tidak ada anggota ditemukan</div>';

          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
          return;

          showToast('Pilih nama peminjam dari daftar pencarian', 'error');

          submitBtn.disabled = false;

          </form>

      `;

    function exportAllData() {
      const allData = appState.allRecords.map(record => ({
        'Tipe Data': record.type,
        'Data': JSON.stringify(record),
        'Timestamp': formatDate(record.timestamp)
      }));

      const csvContent = arrayToCSV(allData, ['Tipe Data', 'Data', 'Timestamp']);
      downloadCSV('backup_full_' + new Date().toISOString().split('T')[0] + '.csv', csvContent);
      showToast(`Backup CSV berhasil! ${allData.length} record diekspor.`, 'success');
    }

    // Backup JSON ditampilkan sebagai tautan yang harus diklik langsung oleh pengguna.
    function downloadBackupJSON() {
      if (!appState.allRecords.length) {
        showToast('Belum ada data yang bisa dicadangkan', 'info');
        return;
      }

      try {
        const backupDate = new Date();
        const backup = {
          app: 'Dashboard Perpustakaan Sekolah',
          appVersion: '18',
          backupVersion: '18',
          createdAt: backupDate.toISOString(),
          recordCount: appState.allRecords.length,
          records: appState.allRecords.map(record => {
            const copy = { ...record };
            delete copy.__backendId;
            return copy;
          })
        };
        const dateLabel = backupDate.toISOString().slice(0, 10);
        downloadCSV(`backup_perpustakaan_${dateLabel}.json`, JSON.stringify(backup, null, 2));
        showToast(`${backup.recordCount} data siap dicadangkan. Klik tombol biru pada panel unduhan.`, 'success');
      } catch (error) {
        showToast('Backup gagal dibuat: ' + (error?.message || 'kesalahan tidak dikenal'), 'error');
      }
    }

   function downloadBookTemplateCSV() {
      const headers = ['Barcode', 'Judul Buku', 'Penulis', 'Kategori', 'Penerbit', 'Tahun Terbit', 'Stok'];
      const exampleRows = [
        ['9786020000000', 'Contoh Judul Buku', 'Nama Penulis', 'Pelajaran', 'Nama Penerbit', '2024', '10']
      ];
      
      // \uFEFF adalah BOM untuk memaksa Excel membacanya dengan format UTF-8 yang benar
      // dan kita gunakan titik koma (;) khusus untuk setelan Excel Indonesia
      const csvContent = "\uFEFF" + [
        headers.join(';'),
        ...exampleRows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(';'))
      ].join('\n');
      
      downloadCSV('template_impor_buku.csv', csvContent);

    async function importMembersFromExcel(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
        if (!rows.length) throw new Error('File Excel kosong');

        const clean = value => String(value ?? '').trim();
        const firstRow = rows[0].map(clean);
        const looksLikeHeader = firstRow.some(value => /nama|name|kelas|class|telepon|phone|hp/i.test(value));
        const dataRows = looksLikeHeader ? rows.slice(1) : rows;

        const parsedMembers = dataRows.map(row => {
          const values = row.map(clean);
          return {
            memberName: values[0] || '-',
            memberClass: values[1] || '-',
            memberPhone: values[2] || '-'
          };
        }).filter(m => m.memberName !== '-');

        if (!parsedMembers.length) {
          showToast('Tidak ada data anggota valid di file.', 'info');
          event.target.value = '';
          return;
        }

        const progress = createProgressModal('🔄 Mengimpor Data Anggota');
        const existingMembers = getRecordsByType('member');
        let addedCount = 0;
        let updatedCount = 0;
        let failedCount = 0;

        for (let i = 0; i < parsedMembers.length; i++) {
          const item = parsedMembers[i];
          const existing = existingMembers.find(m => clean(m.memberName).toLowerCase() === item.memberName.toLowerCase());

          if (existing) {
            // Nama sama -> Timpa/Update kelas dan telepon
            const updatedRecord = {
              ...existing,
              memberClass: item.memberClass,
              memberPhone: item.memberPhone
            };
            progress.update(i + 1, parsedMembers.length, `Menimpa anggota: ${item.memberName}`);
            const res = await window.dataSdk.update(updatedRecord);
            if (res.isOk) updatedCount++; else failedCount++;
          } else {
            // Nama baru -> Tambah anggota baru
            const newRecord = {
              type: 'member',
              ...item,
              timestamp: new Date().toISOString()
            };
            progress.update(i + 1, parsedMembers.length, `Menambah anggota baru: ${item.memberName}`);
            const res = await window.dataSdk.create(newRecord);
            if (res.isOk) addedCount++; else failedCount++;
          }
        }

        progress.close();
        showToast(`Impor Selesai! ${addedCount} baru, ${updatedCount} ditimpa${failedCount ? `, ${failedCount} gagal` : ''}.`, 'success');

      } catch (error) {
        showToast('File Excel/CSV tidak dapat dibaca.', 'error');
      } finally {
        event.target.value = '';
      }
    }

    async function importBooksFromExcel(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
        if (!rows.length) throw new Error('File Excel kosong');

        const clean = value => String(value ?? '').trim();
        const firstRow = rows[0].map(clean);
        const looksLikeHeader = firstRow.some(value => /barcode|isbn|judul|title|penulis|author|kategori|category|tahun|year|stok|stock|penerbit|publisher/i.test(value));
        const dataRows = looksLikeHeader ? rows.slice(1) : rows;

        const parsedBooks = dataRows.map(row => {
          const values = row.map(clean);
          const barcode = values[0].replace(/\.0+$/, '');
          return {
            bookBarcode: barcode || generateBarcode(),
            bookTitle: values[1] || '-',
            bookAuthor: values[2] || '-',
            bookCategory: values[3] || '-',
            bookPublisher: values.length >= 7 ? (values[4] || '-') : '-',
            bookYear: Number(values.length >= 7 ? values[5] : values[4]) || 0,
            bookStock: Math.max(0, Number(values.length >= 7 ? values[6] : values[5]) || 0)
          };
        }).filter(b => b.bookTitle !== '-' && b.bookAuthor !== '-');

        if (!parsedBooks.length) {
          showToast('Tidak ada data buku valid di file.', 'info');
          event.target.value = '';
          return;
        }

        const progress = createProgressModal('🔄 Mengimpor Data Buku');
        const existingBooks = getRecordsByType('book');
        let addedCount = 0;
        let updatedCount = 0;
        let failedCount = 0;

        for (let i = 0; i < parsedBooks.length; i++) {
          const item = parsedBooks[i];
          const existing = existingBooks.find(b => clean(b.bookBarcode) === item.bookBarcode);

          if (existing) {
            // Barcode sama -> Timpa/Update data lama
            const updatedRecord = {
              ...existing,
              bookTitle: item.bookTitle,
              bookAuthor: item.bookAuthor,
              bookCategory: item.bookCategory,
              bookPublisher: item.bookPublisher,
              bookYear: item.bookYear,
              bookStock: item.bookStock
            };
            progress.update(i + 1, parsedBooks.length, `Menimpa data: ${item.bookTitle}`);
            const res = await window.dataSdk.update(updatedRecord);
            if (res.isOk) updatedCount++; else failedCount++;
          } else {
            // Barcode baru -> Buat record baru
            const newRecord = {
              type: 'book',
              ...item,
              timestamp: new Date().toISOString()
            };
            progress.update(i + 1, parsedBooks.length, `Menambah baru: ${item.bookTitle}`);
            const res = await window.dataSdk.create(newRecord);
            if (res.isOk) addedCount++; else failedCount++;
          }
        }

        progress.close();
        showToast(`Impor Selesai! ${addedCount} baru, ${updatedCount} ditimpa${failedCount ? `, ${failedCount} gagal` : ''}.`, 'success');

      } catch (error) {
        showToast('File Excel/CSV tidak dapat dibaca.', 'error');
      } finally {
        event.target.value = '';
      }
    }

    function createProgressModal(title) {
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black bg-opacity-50 modal-backdrop flex items-center justify-center z-50 p-4';
      modal.innerHTML = `
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full text-center">
          <h3 class="text-lg font-bold text-gray-800 mb-4">${title}</h3>
          <div class="w-full bg-gray-200 rounded-full h-4 mb-3 overflow-hidden">
            <div id="importProgressBar" class="bg-blue-600 h-4 rounded-full transition-all duration-200" style="width: 0%"></div>
          </div>
          <p id="importProgressText" class="text-sm text-gray-600 font-semibold">0% (0 / 0)</p>
          <p id="importProgressDetail" class="text-xs text-gray-500 mt-2">Menyiapkan data...</p>
        </div>
      `;
      document.body.appendChild(modal);
      
      return {
        update(current, total, detailText = '') {
          const percent = total > 0 ? Math.round((current / total) * 100) : 0;
          const bar = modal.querySelector('#importProgressBar');
          const text = modal.querySelector('#importProgressText');
          const detail = modal.querySelector('#importProgressDetail');
          if (bar) bar.style.width = `${percent}%`;
          if (text) text.textContent = `${percent}% (${current} dari ${total})`;
          if (detail && detailText) detail.textContent = detailText;
        },
        close() {
          modal.remove();
        }
      };
    }

    async function restoreBackupJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const backup = JSON.parse(text);
        // Mendukung beberapa bentuk backup lama agar data versi 13 dapat dipulihkan ke versi 18.
        const sourceRecords = Array.isArray(backup)
          ? backup
          : Array.isArray(backup?.records)
            ? backup.records
            : Array.isArray(backup?.data)
              ? backup.data
              : Array.isArray(backup?.allRecords)
                ? backup.allRecords
                : [];
        if (!sourceRecords.length) {
          showToast('Backup versi 13 tidak berisi data yang dapat dipulihkan.', 'error');
          event.target.value = '';
          return;
        }
        const records = sourceRecords
          .filter(record => record && typeof record === 'object' && record.type)
          .map(record => {
            const cleanRecord = { ...record };
            delete cleanRecord.__backendId;
            return cleanRecord;
          });
        if (!records.length) {
          showToast('Backup tidak memiliki data buku, anggota, transaksi, atau kunjungan yang valid.', 'error');
          event.target.value = '';
          return;
        }
        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 bg-black bg-opacity-50 modal-backdrop flex items-center justify-center z-50 p-4';
        modal.innerHTML = `<div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full">
          <h2 class="text-2xl font-bold mb-4" style="color: ${window.elementSdk?.config?.text_color || defaultConfig.text_color};">🔄 Konfirmasi Restore</h2>
          <p class="text-gray-700 mb-3">File berisi <strong>${records.length} data</strong> dari backup tanggal <strong>${backup.createdAt ? formatDate(backup.createdAt) : '-'}</strong>.</p>
          <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-lg mb-6"><p class="text-sm text-gray-700">Data akan <strong>ditambahkan</strong> ke Canva Sheet saat ini. Hindari memilih file yang sama lebih dari sekali.</p></div>
          <div class="flex gap-3"><button id="confirmRestore" class="flex-1 px-6 py-3 rounded-lg text-white font-semibold" style="background: ${window.elementSdk?.config?.primary_color || defaultConfig.primary_color};">Pulihkan Data</button><button type="button" onclick="this.closest('.fixed').remove()" class="px-6 py-3 rounded-lg border-2 border-gray-300 font-semibold">Batal</button></div>
        </div>`;
        modal.querySelector('#confirmRestore').addEventListener('click', async function() {
          this.disabled = true;
          this.innerHTML = '<div class="loading-spinner mx-auto"></div>';
          let restored = 0;
          let failed = 0;
          for (const record of records) {
            const result = await window.dataSdk.create(record);
            if (result.isOk) restored++; else failed++;
          }
          modal.remove();
          event.target.value = '';
          if (failed === 0) showToast(`${restored} data berhasil dipulihkan ke Canva Sheet.`, 'success');
          else showToast(`${restored} data dipulihkan, ${failed} data gagal.`, 'error');
        });
        document.body.appendChild(modal);
      } catch (error) {
        showToast('File backup tidak dapat dibaca.', 'error');
        event.target.value = '';
      }
    }

    // Export Functions
    function getSelectedReportRows() {
      const reportType = document.getElementById('reportType')?.value || 'books';
      const startDate = document.getElementById('startDate')?.value || '';
      const endDate = document.getElementById('endDate')?.value || '';
      const filterByDate = (records) => {
        if (!startDate && !endDate) return records;
        const start = startDate ? new Date(startDate + 'T00:00:00') : new Date(0);
        const end = endDate ? new Date(endDate + 'T23:59:59') : new Date();
        return records.filter(r => {
          const value = new Date(r.timestamp || r.loanDate || r.returnDate);
          return value >= start && value <= end;
        });
      };
      let headers = [], rows = [], title = 'Laporan Perpustakaan';
      if (reportType === 'books') {
        headers = ['Barcode','Judul','Penulis','Kategori','Penerbit','Tahun','Stok'];
        rows = filterByDate(getRecordsByType('book')).map(b => [b.bookBarcode,b.bookTitle,b.bookAuthor,b.bookCategory,b.bookPublisher,b.bookYear,b.bookStock]);
        title = 'Laporan Koleksi Buku';
      } else if (reportType === 'members') {
        headers = ['Nama','Kelas','Telepon','Tanggal Daftar'];
        rows = filterByDate(getRecordsByType('member')).map(m => [m.memberName,m.memberClass,m.memberPhone,formatDate(m.timestamp)]);
        title = 'Laporan Data Anggota';
      } else if (reportType === 'loans') {
        headers = ['Barcode','Peminjam','Jumlah Buku','Tgl Pinjam','Jatuh Tempo','Status'];
        rows = filterByDate(getRecordsByType('loan').filter(l => l.loanStatus === 'dipinjam')).map(l => [l.loanBarcode,l.loanMember,l.loanBooks,formatDate(l.loanDate),formatDate(l.loanDueDate),'Dipinjam']);
        title = 'Laporan Peminjaman Aktif';
      } else if (reportType === 'returns') {
        headers = ['Barcode','Peminjam','Jumlah Buku','Tgl Pinjam','Tgl Kembali','Keterlambatan','Status Denda'];
        rows = filterByDate(getRecordsByType('loan').filter(l => l.loanStatus === 'dikembalikan')).map(l => [l.loanBarcode,l.loanMember,l.loanBooks,formatDate(l.loanDate),formatDate(l.returnDate),(l.lateDays || 0) + ' hari',l.finePaid ? 'Lunas' : 'Belum']);
        title = 'Laporan Pengembalian';
      } else if (reportType === 'fines') {
        headers = ['Peminjam','Barcode','Keterlambatan','Jumlah Denda','Status'];
        rows = filterByDate(getRecordsByType('loan').filter(l => l.loanStatus === 'dikembalikan' && l.lateDays > 0)).map(l => [l.loanMember,l.loanBarcode,l.lateDays + ' hari','Rp ' + (l.lateDays * 1000).toLocaleString('id-ID'),l.finePaid ? 'Lunas' : 'Belum Bayar']);
        title = 'Laporan Denda';
      } else {
        headers = ['Tipe','Data'];
        rows = [...filterByDate(getRecordsByType('book')).map(b => ['Buku', `${b.bookTitle} - ${b.bookAuthor}`]), ...filterByDate(getRecordsByType('member')).map(m => ['Anggota', `${m.memberName} - ${m.memberClass}`]), ...filterByDate(getRecordsByType('loan')).map(l => ['Transaksi', `${l.loanMember} - ${l.loanBarcode} (${l.loanStatus})`])];
        title = 'Laporan Lengkap Perpustakaan';
      }
      return { headers, rows, title };
    }

    function downloadExcelReport() {
      const report = getSelectedReportRows();
      if (!report.rows.length) return showToast('Tidak ada data untuk diunduh', 'info');
      const table = `<table border="1"><tr>${report.headers.map(h => `<th>${h}</th>`).join('')}</tr>${report.rows.map(row => `<tr>${row.map(cell => `<td>${String(cell ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</td>`).join('')}</tr>`).join('')}</table>`;
      const content = `<html><head><meta charset="UTF-8"></head><body><h2>${report.title}</h2>${table}</body></html>`;
      downloadCSV(report.title.toLowerCase().replace(/[^a-z0-9]+/gi, '_') + '.xls', content);
      showToast('Laporan Excel berhasil diunduh!', 'success');
    }

    function downloadPDFReport() {
      const report = getSelectedReportRows();
      if (!report.rows.length) return showToast('Tidak ada data untuk diunduh', 'info');
      const printWindow = window.open('', '_blank');
      if (!printWindow) return showToast('Unduhan PDF diblokir browser. Izinkan pop-up lalu coba lagi.', 'error');
      const table = `<table><thead><tr>${report.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${report.rows.map(row => `<tr>${row.map(cell => `<td>${String(cell ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      printWindow.document.write(`<html><head><title>${report.title}</title><style>body{font-family:Arial,sans-serif;padding:24px;color:#1f2937}h1{font-size:20px}p{color:#6b7280}table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #cbd5e1;padding:6px;text-align:left}th{background:#e2e8f0}@media print{body{padding:0}}</style></head><body><h1>${report.title}</h1><p>Dicetak: ${new Date().toLocaleString('id-ID')}</p>${table}</body></html>`);
      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => { printWindow.print(); }, 300);
      showToast('Laporan PDF siap disimpan melalui pilihan Print → Save as PDF.', 'success');
    }

    function exportToCSV() {
      const reportType = document.getElementById('reportType').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      let data = [];
      let headers = [];
      let filename = '';

      const filterByDate = (records) => {
        if (!startDate && !endDate) return records;
        return records.filter(r => {
          const recordDate = new Date(r.timestamp);
          const start = startDate ? new Date(startDate) : new Date(0);
          const end = endDate ? new Date(endDate) : new Date();
          return recordDate >= start && recordDate <= end;
        });
      };

      switch(reportType) {
        case 'books':
          data = filterByDate(getRecordsByType('book')).map(b => ({
            'Barcode': b.bookBarcode,
            'Judul': b.bookTitle,
            'Penulis': b.bookAuthor,
            'Kategori': b.bookCategory,
            'Penerbit': b.bookPublisher,
            'Tahun': b.bookYear,
            'Stok': b.bookStock
          }));
          headers = ['Barcode', 'Judul', 'Penulis', 'Kategori', 'Penerbit', 'Tahun', 'Stok'];
          filename = 'laporan_buku.csv';
          break;

        case 'members':
          data = filterByDate(getRecordsByType('member')).map(m => ({
            'Nama': m.memberName,
            'Kelas': m.memberClass,
            'Telepon': m.memberPhone,
            'Tanggal Daftar': formatDate(m.timestamp)
          }));
          headers = ['Nama', 'Kelas', 'Telepon', 'Tanggal Daftar'];
          filename = 'laporan_anggota.csv';
          break;

        case 'loans':
          data = filterByDate(getRecordsByType('loan').filter(l => l.loanStatus === 'dipinjam')).map(l => ({
            'Barcode': l.loanBarcode,
            'Peminjam': l.loanMember,
            'Jumlah Buku': l.loanBooks,
            'Tgl Pinjam': formatDate(l.loanDate),
            'Jatuh Tempo': formatDate(l.loanDueDate),
            'Keterlambatan': calculateLateDays(l.loanDueDate) + ' hari'
          }));
          headers = ['Barcode', 'Peminjam', 'Jumlah Buku', 'Tgl Pinjam', 'Jatuh Tempo', 'Keterlambatan'];
          filename = 'laporan_peminjaman.csv';
          break;

        case 'returns':
          data = filterByDate(getRecordsByType('loan').filter(l => l.loanStatus === 'dikembalikan')).map(r => ({
            'Barcode': r.loanBarcode,
            'Peminjam': r.loanMember,
            'Jumlah Buku': r.loanBooks,
            'Tgl Pinjam': formatDate(r.loanDate),
            'Tgl Kembali': formatDate(r.returnDate),
            'Keterlambatan': r.lateDays + ' hari',
            'Denda': r.lateDays > 0 ? 'Rp ' + (r.lateDays * 1000).toLocaleString('id-ID') : '-',
            'Status Bayar': r.finePaid ? 'Lunas' : 'Belum'
          }));
          headers = ['Barcode', 'Peminjam', 'Jumlah Buku', 'Tgl Pinjam', 'Tgl Kembali', 'Keterlambatan', 'Denda', 'Status Bayar'];
          filename = 'laporan_pengembalian.csv';
          break;

        case 'fines':
          data = filterByDate(getRecordsByType('loan').filter(l => l.loanStatus === 'dikembalikan' && l.lateDays > 0)).map(f => ({
            'Peminjam': f.loanMember,
            'Barcode': f.loanBarcode,
            'Keterlambatan': f.lateDays + ' hari',
            'Jumlah Denda': 'Rp ' + (f.lateDays * 1000).toLocaleString('id-ID'),
            'Status': f.finePaid ? 'Lunas' : 'Belum Bayar'
          }));
          headers = ['Peminjam', 'Barcode', 'Keterlambatan', 'Jumlah Denda', 'Status'];
          filename = 'laporan_denda.csv';
          break;

        case 'all':
          const books = filterByDate(getRecordsByType('book'));
          const members = filterByDate(getRecordsByType('member'));
          const loans = filterByDate(getRecordsByType('loan'));
          
          data = [
            ...books.map(b => ({ Tipe: 'Buku', Data: `${b.bookTitle} - ${b.bookAuthor} (${b.bookBarcode})` })),
            ...members.map(m => ({ Tipe: 'Anggota', Data: `${m.memberName} - ${m.memberClass}` })),
            ...loans.map(l => ({ Tipe: 'Transaksi', Data: `${l.loanMember} - ${l.loanBarcode} (${l.loanStatus})` }))
          ];
          headers = ['Tipe', 'Data'];
          filename = 'laporan_lengkap.csv';
          break;
      }

      if (data.length === 0) {
        showToast('Tidak ada data untuk diekspor', 'info');
        return;
      }

      const csvContent = arrayToCSV(data, headers);
      downloadCSV(filename, csvContent);
      showToast(`${data.length} data berhasil diekspor ke CSV`, 'success');
    }

    function copyForGoogleSheets() {
      const reportType = document.getElementById('reportType').value;
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      let data = [];
      let headers = [];

      const filterByDate = (records) => {
        if (!startDate && !endDate) return records;
        return records.filter(r => {
          const recordDate = new Date(r.timestamp);
          const start = startDate ? new Date(startDate) : new Date(0);
          const end = endDate ? new Date(endDate) : new Date();
          return recordDate >= start && recordDate <= end;
        });
      };

      switch(reportType) {
        case 'books':
          headers = ['Barcode', 'Judul', 'Penulis', 'Kategori', 'Penerbit', 'Tahun', 'Stok'];
          data = filterByDate(getRecordsByType('book')).map(b => [
            b.bookBarcode, b.bookTitle, b.bookAuthor, b.bookCategory,

          ]);
          break;

        case 'members':
          headers = ['Nama', 'Kelas', 'Telepon', 'Tanggal Daftar'];
          data = filterByDate(getRecordsByType('member')).map(m => [
            m.memberName, m.memberClass, m.memberPhone, formatDate(m.timestamp)
          ]);
          break;

        case 'loans':
          headers = ['Barcode', 'Peminjam', 'Jumlah Buku', 'Tgl Pinjam', 'Jatuh Tempo', 'Keterlambatan'];
          data = filterByDate(getRecordsByType('loan').filter(l => l.loanStatus === 'dipinjam')).map(l => [
            l.loanBarcode, l.loanMember, l.loanBooks, formatDate(l.loanDate), 
            formatDate(l.loanDueDate), calculateLateDays(l.loanDueDate) + ' hari'
          ]);
          break;

        case 'returns':
          headers = ['Barcode', 'Peminjam', 'Jumlah Buku', 'Tgl Pinjam', 'Tgl Kembali', 'Keterlambatan', 'Denda', 'Status Bayar'];
          data = filterByDate(getRecordsByType('loan').filter(l => l.loanStatus === 'dikembalikan')).map(r => [
            r.loanBarcode, r.loanMember, r.loanBooks, formatDate(r.loanDate), 
            formatDate(r.returnDate), r.lateDays + ' hari',
            r.lateDays > 0 ? 'Rp ' + (r.lateDays * 1000).toLocaleString('id-ID') : '-',
            r.finePaid ? 'Lunas' : 'Belum'
          ]);
          break;

        case 'fines':
          headers = ['Peminjam', 'Barcode', 'Keterlambatan', 'Jumlah Denda', 'Status'];
          data = filterByDate(getRecordsByType('loan').filter(l => l.loanStatus === 'dikembalikan' && l.lateDays > 0)).map(f => [
            f.loanMember, f.loanBarcode, f.lateDays + ' hari',
            'Rp ' + (f.lateDays * 1000).toLocaleString('id-ID'),
            f.finePaid ? 'Lunas' : 'Belum Bayar'
          ]);
          break;

        case 'all':
          headers = ['Tipe', 'Data'];
          const books = filterByDate(getRecordsByType('book'));
          const members = filterByDate(getRecordsByType('member'));
          const loans = filterByDate(getRecordsByType('loan'));
          
          data = [
            ...books.map(b => ['Buku', `${b.bookTitle} - ${b.bookAuthor} (${b.bookBarcode})`]),
            ...members.map(m => ['Anggota', `${m.memberName} - ${m.memberClass}`]),
            ...loans.map(l => ['Transaksi', `${l.loanMember} - ${l.loanBarcode} (${l.loanStatus})`])
          ];
          break;
      }

      if (data.length === 0) {
        showToast('Tidak ada data untuk dicopy', 'info');
        return;
      }

      const textData = [headers.join('\t'), ...data.map(row => row.join('\t'))].join('\n');
      copyToClipboard(textData);
      showToast(`${data.length} baris data berhasil dicopy! Paste di Google Sheets dengan Ctrl+V`, 'success');
    }

    // Navigation
    function navigateTo(section) {
      appState.currentSection = section;
      render();
    }

    function logout() {
      appState.currentUser = null;
      appState.currentSection = 'dashboard';
      render();
    }

    // Mobile Menu Functions
    function toggleMobileMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobileOverlay');
      
      if (sidebar && overlay) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      }
    }

    function closeMobileMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobileOverlay');
      
      if (sidebar && overlay) {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      }
    }

    // Render Functions
    function render() {
      const app = document.getElementById('app');
      
      if (!appState.currentUser) {
        app.innerHTML = renderLoginPage();
        setupLoginHandlers();
        return;
      }

      app.innerHTML = renderDashboard();
      renderCurrentSection();
    }

    function renderCurrentSection() {
      const content = document.getElementById('mainContent');
      
      switch(appState.currentSection) {
        case 'dashboard':
          content.innerHTML = renderDashboardHome();
          break;
        case 'books':
          content.innerHTML = renderBooksSection();
          break;
        case 'members':
          content.innerHTML = renderMembersSection();
          break;
        case 'loans':
          content.innerHTML = renderLoansSection();
          break;
        case 'returns':
          content.innerHTML = renderReturnsSection();
          break;
        case 'visitors':
          content.innerHTML = renderVisitorsSection();
          break;
        case 'fines':
          content.innerHTML = renderFinesSection();
          break;
        case 'reports':
          content.innerHTML = renderReportsSection();
          break;
        case 'categories':
          content.innerHTML = renderCategoriesSection();
          break;
        case 'statistics':
          content.innerHTML = renderStatisticsSection();
          break;
        case 'users':
          content.innerHTML = renderUsersSection();
          break;
        case 'settings':
          content.innerHTML = renderSettingsSection();
          break;
        case 'help':
          content.innerHTML = renderHelpSection();
          break;
        default:
          content.innerHTML = `
            <div class="text-center py-20">
              <p class="text-2xl font-bold mb-4" style="color: ${window.elementSdk?.config?.text_color || defaultConfig.text_color};">   Dalam Pengembangan</p>
              <p class="text-gray-600">Fitur ${appState.currentSection} sedang dalam pengembangan.</p>
            </div>
          `;
      }
    }

    function setupLoginHandlers() {
      const loginForm = document.getElementById('loginForm');
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');
        
        loginBtn.innerHTML = '<div class="loading-spinner mx-auto"></div>';
        loginBtn.disabled = true;

        const users = getRecordsByType('user');
        const user = users.find(u => u.username === username && u.password === password);

        if (user) {
          appState.currentUser = user;
          render();
        } else {
          if (users.length === 0 && username === 'admin' && password === 'admin') {
            const adminUser = {
              type: 'user',
              username: 'admin',
              password: 'admin',
              fullName: 'Administrator',
              role: 'Admin',
              timestamp: new Date().toISOString()
            };
            const result = await window.dataSdk.create(adminUser);
            if (result.isOk) {
              showToast('Akun admin berhasil dibuat! Silakan login kembali.', 'success');
            }
          } else {
            showToast('Username atau password salah', 'error');
          }
          loginBtn.textContent = 'Masuk';
          loginBtn.disabled = false;
        }
      });
    }

    // Data SDK Handler
    const dataHandler = {
      onDataChanged(data) {
        appState.allRecords = data;
        
        if (appState.currentUser) {
          const userStillExists = data.find(r => r.__backendId === appState.currentUser.__backendId);
          if (!userStillExists) {
            appState.currentUser = null;
            render();
            return;
          }
        }

        if (appState.currentUser) {
          renderCurrentSection();
        } else {
          render();
        }
      }
    };

    // Element SDK Configuration
    async function onConfigChange(config) {
      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const secondaryColor = config.secondary_color || defaultConfig.secondary_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const successColor = config.success_color || defaultConfig.success_color;
      const dangerColor = config.danger_color || defaultConfig.danger_color;
      const appTitle = config.app_title || defaultConfig.app_title;
      const schoolName = config.school_name || defaultConfig.school_name;
      const footerCredit = config.footer_credit || defaultConfig.footer_credit;
      const fontFamily = config.font_family || defaultConfig.font_family;
      const fontSize = config.font_size || defaultConfig.font_size;

      document.body.style.fontFamily = `${fontFamily}, Inter, sans-serif`;
      document.body.style.fontSize = `${fontSize}px`;

      const titleElements = document.querySelectorAll('#login-title, #sidebar-title');
      titleElements.forEach(el => {
        if (el) el.textContent = appTitle;
      });

      const schoolElements = document.querySelectorAll('#login-school, #sidebar-school');
      schoolElements.forEach(el => {
        if (el) el.textContent = schoolName;
      });

      const footerElements = document.querySelectorAll('#login-footer, #main-footer');
      footerElements.forEach(el => {
        if (el) el.textContent = footerCredit;
      });

      render();
    }

    // Initialize
    async function init() {
      const appRoot = document.getElementById('app');
      appRoot.innerHTML = `
        <div class="h-full w-full flex items-center justify-center p-6" style="background:#24351f;">
          <div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-2xl">
            <div class="mx-auto mb-4 h-10 w-10 rounded-full border-4 border-gray-200 border-t-blue-600 animate-spin"></div>
            <h1 class="text-xl font-bold text-gray-800">Memuat Dashboard</h1>
            <p class="mt-2 text-sm text-gray-500">Menyiapkan data perpustakaan, mohon tunggu sebentar.</p>
          </div>
        </div>
      `;

      try {
        const initResult = await window.dataSdk.init(dataHandler);
      
      if (!initResult.isOk) {
        showToast('Gagal menginisialisasi aplikasi', 'error');
        return;
      }

      await createDemoAccounts();

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities: (config) => ({
            recolorables: [
              {
                get: () => config.primary_color || defaultConfig.primary_color,
                set: (value) => {
                  config.primary_color = value;
                  window.elementSdk.setConfig({ primary_color: value });
                }
              },
              {
                get: () => config.secondary_color || defaultConfig.secondary_color,
                set: (value) => {
                  config.secondary_color = value;
                  window.elementSdk.setConfig({ secondary_color: value });
                }
              },
              {
                get: () => config.text_color || defaultConfig.text_color,
                set: (value) => {
                  config.text_color = value;
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
              {
                get: () => config.success_color || defaultConfig.success_color,
                set: (value) => {
                  config.success_color = value;
                  window.elementSdk.setConfig({ success_color: value });
                }
              },
              {
                get: () => config.danger_color || defaultConfig.danger_color,
                set: (value) => {
                  config.danger_color = value;
                  window.elementSdk.setConfig({ danger_color: value });
                }
              }
            ],
            borderables: [],
            fontEditable: {
              get: () => config.font_family || defaultConfig.font_family,
              set: (value) => {
                config.font_family = value;
                window.elementSdk.setConfig({ font_family: value });
              }
            },
            fontSizeable: {
              get: () => config.font_size || defaultConfig.font_size,
              set: (value) => {
                config.font_size = value;
                window.elementSdk.setConfig({ font_size: value });
              }
            }
          }),
          mapToEditPanelValues: (config) => new Map([
            ['app_title', config.app_title || defaultConfig.app_title],
            ['school_name', config.school_name || defaultConfig.school_name],
            ['footer_credit', config.footer_credit || defaultConfig.footer_credit]
          ])
        });
      }

      render();
      } catch (error) {
        console.error("Error memuat aplikasi:", error);
        appRoot.innerHTML = `
          <div class="h-full w-full flex items-center justify-center p-6 bg-gray-100">
            <div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-lg">
              <h1 class="text-xl font-bold text-red-600 mb-2">Gagal Terhubung ke Database</h1>
              <p class="text-sm text-gray-600">Pastikan URL Google Apps Script Anda sudah benar dan Anda memiliki koneksi internet.</p>
            </div>
          </div>
        `;
      }
    }

    init();
  </script>
